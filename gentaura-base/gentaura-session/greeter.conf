# ============================================================================
# GentAura - Fragment de configuration greetd (/etc/greetd/)
# Delègue l'ouverture de session a PAM puis lance le shell Ash via logind.
# ============================================================================
[terminal]
vt = 1

[default_session]
# agreety = prompteur texte minimal -> authentifie l'utilisateur Unix local
command = "agreety --cmd /usr/bin/gentaura-session-start"
user = "greeter"
